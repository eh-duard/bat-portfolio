<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0d14"/>
      <stop offset="0.45" stop-color="#0c1018"/>
      <stop offset="0.75" stop-color="#10141d"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e7dcc0"/>
      <stop offset="0.7" stop-color="#c9bd9a"/>
      <stop offset="1" stop-color="#c9bd9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.62" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#243149" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#243149" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1119" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1119" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#haze)"/>

  <!-- luna velata -->
  <circle cx="1010" cy="235" r="150" fill="url(#moon)" opacity="0.5"/>
  <circle cx="1010" cy="235" r="86" fill="#d8ccac" opacity="0.85"/>
  <circle cx="1052" cy="212" r="86" fill="#0c1018" opacity="0.7"/>

  <!-- fascio di ricerca -->
  <polygon points="150,900 250,240 320,240 700,900" fill="#c9d6ee" opacity="0.05"/>

  <!-- skyline lontano -->
  <g fill="#0b0f17">
    <rect x="0" y="560" width="70" height="340"/>
    <rect x="70" y="600" width="55" height="300"/>
    <rect x="140" y="520" width="85" height="380"/>
    <rect x="245" y="580" width="60" height="320"/>
    <rect x="320" y="540" width="70" height="360"/>
    <rect x="410" y="600" width="90" height="300"/>
    <rect x="520" y="560" width="65" height="340"/>
    <rect x="600" y="520" width="80" height="380"/>
    <rect x="700" y="590" width="70" height="310"/>
    <rect x="790" y="545" width="95" height="355"/>
    <rect x="900" y="600" width="70" height="300"/>
    <rect x="990" y="560" width="85" height="340"/>
    <rect x="1095" y="520" width="70" height="380"/>
    <rect x="1185" y="590" width="80" height="310"/>
    <rect x="1285" y="545" width="70" height="355"/>
    <rect x="1370" y="600" width="90" height="300"/>
    <rect x="1480" y="555" width="120" height="345"/>
  </g>

  <!-- skyline medio con guglie gotiche -->
  <g fill="#070a10">
    <path d="M60 900 V500 h120 v-30 h20 v30 h120 V900 Z"/>
    <path d="M330 900 V440 l45 -60 l45 60 V900 Z"/>
    <rect x="430" y="470" width="150" height="430"/>
    <path d="M470 470 v-40 h20 v-30 h20 v30 h20 v40 Z"/>
    <rect x="620" y="500" width="110" height="400"/>
    <path d="M770 900 V420 l55 -70 l55 70 V900 Z"/>
    <rect x="905" y="480" width="140" height="420"/>
    <path d="M945 480 v-55 h18 v-28 h18 v28 h18 v55 Z"/>
    <rect x="1085" y="510" width="115" height="390"/>
    <path d="M1230 900 V450 l50 -66 l50 66 V900 Z"/>
    <rect x="1360" y="490" width="150" height="410"/>
    <path d="M1400 490 v-46 h22 v-30 h22 v30 h22 v46 Z"/>
  </g>

  <!-- finestre accese (poche, sparse) -->
  <g fill="#e6c15a" opacity="0.65">
    <rect x="452" y="500" width="6" height="10"/><rect x="470" y="540" width="6" height="10"/>
    <rect x="512" y="600" width="6" height="10"/><rect x="548" y="520" width="6" height="10"/>
    <rect x="648" y="560" width="6" height="10"/><rect x="700" y="620" width="6" height="10"/>
    <rect x="930" y="540" width="6" height="10"/><rect x="980" y="600" width="6" height="10"/>
    <rect x="1010" y="520" width="6" height="10"/><rect x="1110" y="560" width="6" height="10"/>
    <rect x="1160" y="640" width="6" height="10"/><rect x="1390" y="540" width="6" height="10"/>
    <rect x="1440" y="600" width="6" height="10"/><rect x="1470" y="560" width="6" height="10"/>
  </g>

  <!-- nebbia bassa -->
  <rect x="0" y="600" width="1600" height="300" fill="url(#fog)"/>
</svg>
